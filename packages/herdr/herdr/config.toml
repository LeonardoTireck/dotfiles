onboarding = false

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = true

[ui]
status_indicators = "dots"

[theme]
name = "catppuccin"
auto_switch = false

[keys]
prefix = "ctrl+s"
previous_workspace = "prefix+shift+k"
next_workspace = "prefix+shift+j"
